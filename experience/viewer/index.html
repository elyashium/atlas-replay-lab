<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Atlas model viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; color: #cfd6dd; font: 14px/1.4 system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 12px; top: 10px; font-size: 12px; opacity: 0.85; pointer-events: none; }
  #xr-button { position: fixed; right: 12px; bottom: 12px; padding: 10px 16px; font-size: 14px; }
  #poster { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #err { position: fixed; left: 12px; bottom: 12px; color: #ff9d9d; max-width: 60ch; }
</style>
</head>
<body>
<div id="wrap"><canvas id="scene"></canvas></div>
<div id="hud">atlas viewer · <span id="hud-tier">…</span></div>
<button id="xr-button" data-atlas-target="xr" type="button">Enter XR</button>
<div id="poster"><div><h1>Static preview</h1><p id="poster-meta"></p></div></div>
<div id="err"></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
