name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Unit suites only: no network, no browser, no key (see `npm test`).
    # Browser stages (matrix/replay) stay local via `atlas doctor`/`atlas all`.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
